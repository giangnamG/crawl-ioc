upstream url_hunter_backend {
    server backend:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 16m;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location ~* "(^|/)\.git(/|$)" {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* "(^|/)\.env([./].*)?$" {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* "(^|/)\.(?!well-known/)" {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* "(^|/)(Dockerfile|docker-compose\.ya?ml|requirements\.txt)$" {
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        auth_basic "88i Production";
        auth_basic_user_file /etc/nginx/.htpasswd-app;

        proxy_pass http://url_hunter_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

