name: 88i-app

services:
  backend:
    build:
      context: ..
      dockerfile: deploy2/Dockerfile.backend
    env_file:
      - ${APP_ENV_FILE:-app.env}
    restart: unless-stopped
    environment:
      APP_ENV: production
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DB_BACKEND: postgresql
      HOME: /home/appuser
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST is required}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AUTO_WORKER_ENABLED: ${AUTO_WORKER_ENABLED:-true}
      CLOAK_HEADLESS: ${CLOAK_HEADLESS:-1}
      BROWSER_PROVIDER: ${BROWSER_PROVIDER:-cloak}
      CLOAKBROWSER_CACHE_DIR: /home/appuser/.cloakbrowser
      CLOAK_PROFILE_ROOT: /data/cloak_profiles
    volumes:
      - type: bind
        source: ${BACKEND_DATA_DIR:-/opt/88i/backend/data}
        target: /data
        bind:
          create_host_path: true
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5).read(1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: ..
      dockerfile: deploy2/Dockerfile.nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NGINX_BASIC_AUTH_USER: ${NGINX_BASIC_AUTH_USER:?NGINX_BASIC_AUTH_USER is required}
      NGINX_BASIC_AUTH_PASSWORD: ${NGINX_BASIC_AUTH_PASSWORD:?NGINX_BASIC_AUTH_PASSWORD is required}
    ports:
      - "${HTTP_PORT:-80}:80"

