services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ioc_investigator}
      POSTGRES_USER: ${POSTGRES_USER:-ioc_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - type: bind
        source: /opt/url-hunter/postgresql/data
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DB_BACKEND: postgresql
      HOME: /home/appuser
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ioc_investigator}
      POSTGRES_USER: ${POSTGRES_USER:-ioc_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      AUTO_WORKER_ENABLED: ${AUTO_WORKER_ENABLED:-true}
      CLOAK_HEADLESS: "1"
      BROWSER_PROVIDER: cloak
      CLOAKBROWSER_CACHE_DIR: /home/appuser/.cloakbrowser
      CLOAK_PROFILE_ROOT: /data/cloak_profiles
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5).read(1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NGINX_BASIC_AUTH_USER: ${NGINX_BASIC_AUTH_USER:-admin}
      NGINX_BASIC_AUTH_PASSWORD: ${NGINX_BASIC_AUTH_PASSWORD:-change-this-basic-auth-password}
    ports:
      - "${HTTP_PORT:-80}:80"
