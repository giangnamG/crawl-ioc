services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ioc_investigator}
      POSTGRES_USER: ${POSTGRES_USER:-ioc_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DB_BACKEND: postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ioc_investigator}
      POSTGRES_USER: ${POSTGRES_USER:-ioc_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      AUTO_WORKER_ENABLED: ${AUTO_WORKER_ENABLED:-true}
      CLOAK_HEADLESS: "1"
      BROWSER_PROVIDER: cloak
      CLOAK_PROFILE_ROOT: /data/cloak_profiles
    volumes:
      - backend-data:/data
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5).read(1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ./nginx/.htpasswd-app
        target: /etc/nginx/.htpasswd-app
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres-data:
  backend-data:
