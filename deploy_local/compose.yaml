name: 88i-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: 88i-postgres
    restart: unless-stopped
    env_file:
      - .env.backend.local
    ports:
      - "${POSTGRES_PUBLIC_HOST:-127.0.0.1}:${POSTGRES_PUBLIC_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
